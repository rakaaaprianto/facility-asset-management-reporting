services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrs-infomedia-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: amrs-infomedia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-amrs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongDBPassword123!}
      POSTGRES_DB: ${DB_NAME:-infomedia_amrs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amrs_user} -d ${DB_NAME:-infomedia_amrs}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
